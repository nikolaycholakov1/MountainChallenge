<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>39 Първенци на планините в България</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="container">

        <header class="page-header">
            <h1>🏔 39 Първенци на планините в България</h1>

            <div class="progress-section">
                <div class="progress-text">
                    Прогрес: <span id="progress-text"></span> върха
                </div>

                <progress id="progress-bar" max="39"></progress>
            </div>
        </header>

        <section class="bulgaria-section">

            <div class="columns">

                <div class="column">
                    <ol id="mountains-left"></ol>
                </div>

                <div class="column">
                    <ol id="mountains-right" start="21"></ol>
                </div>

            </div>

        </section>

        <section class="international-section">

            <h2>🌍 International Summits</h2>

            <div id="international-list"></div>

        </section>

    </main>

    <!-- Photo Gallery -->
    <div id="gallery-overlay" class="gallery-overlay hidden">

        <div class="gallery">

            <button id="gallery-close" class="gallery-close">&times;</button>

            <h2 id="gallery-title"></h2>

            <div class="gallery-image-wrapper">

                <button id="gallery-prev" class="gallery-prev">❮</button>

                <img id="gallery-image" class="gallery-image" alt="Mountain photo">

                <button id="gallery-next" class="gallery-next">❯</button>

            </div>

            <p id="gallery-caption" class="gallery-caption"></p>

            <div id="gallery-counter" class="gallery-counter"></div>

        </div>

    </div>

    <script type="module" src="js/script.js"></script>

</body>

</html>
